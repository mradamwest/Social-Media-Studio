name: Windows Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore SocialMediaStudio.sln
      - run: dotnet build SocialMediaStudio.sln -c Release --no-restore
      - run: dotnet publish src/SocialMediaStudio/SocialMediaStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Social-Media-Studio-Windows
          path: publish/
