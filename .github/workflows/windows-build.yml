name: Windows Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore SocialMediaStudio.sln
      - run: dotnet build SocialMediaStudio.sln -c Release --no-restore
      - run: dotnet publish src/SocialMediaStudio/SocialMediaStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Build Windows installer
        run: '& "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" installer\\SocialMediaStudio.iss'
        shell: pwsh
      - uses: actions/upload-artifact@v6
        with:
          name: Social-Media-Studio-Windows-Installer
          path: installer/output/Social-Media-Studio-Setup.exe
      - uses: actions/upload-artifact@v6
        with:
          name: Social-Media-Studio-Windows-Portable
          path: publish/
